name: Mobile fingerprint

# Does this PR change native code (anything in the native fingerprint)? If
# so, it ships to people in the next store build, so the PR gets the
# "📱 Native Change" label and a summary of what changed, and its
# description's "Native change:" line can't say "no". It says "yes,
# compatible" when older binaries still run this JavaScript (updates keep
# reaching them), or "yes, new runtime" when the PR raises RUNTIME_VERSION
# in apps/mobile/app.config.ts. Both fingerprints come from this one job on
# one OS, so they compare cleanly (fingerprints differ between macOS and
# Linux). SYNQ is iOS only.
on:
  pull_request:
    # Edited: the description's "Native change:" line is checked here too.
    types: [opened, edited, reopened, synchronize]
    paths:
      - apps/mobile/**
      - packages/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/mobile-fingerprint.yml

concurrency:
  group: mobile-fingerprint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The default checkout is the merge result, which is what the
          # base would become.
          fetch-depth: 0

      - name: Setup
        uses: ./tooling/github/setup

      - name: Fingerprint the merge result
        working-directory: apps/mobile
        run: |
          mkdir -p "$RUNNER_TEMP/fp/head" "$RUNNER_TEMP/fp/base"
          npx expo-updates fingerprint:generate --platform ios > "$RUNNER_TEMP/fp/head/ios.json"

      - name: Fingerprint the base
        run: |
          # Back to the merge result afterward: Setup's post step needs its
          # action, which a base from before the 3.0 app doesn't have.
          trap 'git checkout --quiet "$GITHUB_SHA"' EXIT
          git checkout --quiet "${{ github.event.pull_request.base.sha }}"
          if [ ! -f apps/mobile/app.config.ts ]; then
            # Bases from before the 3.0 app have no runtime to compare.
            echo "none" > "$RUNNER_TEMP/fp/base/missing"
            exit 0
          fi
          pnpm install --frozen-lockfile
          cd apps/mobile
          npx expo-updates fingerprint:generate --platform ios > "$RUNNER_TEMP/fp/base/ios.json"

      - id: compare
        name: Compare
        run: |
          changed=""
          {
            echo "## Native fingerprint"
            echo
            if [ -f "$RUNNER_TEMP/fp/base/missing" ]; then
              echo "- 📱 The base has no 3.0 app; this PR adds one."
              changed="ios"
            else
              head_hash="$(jq -r .hash "$RUNNER_TEMP/fp/head/ios.json")"
              base_hash="$(jq -r .hash "$RUNNER_TEMP/fp/base/ios.json")"
              if [ "$head_hash" = "$base_hash" ]; then
                echo "- ✅ **ios** unchanged"
              else
                changed="ios"
                echo "- 📱 **ios** changed: ships in the next store build"
                jq -r -n \
                  --slurpfile h "$RUNNER_TEMP/fp/head/ios.json" \
                  --slurpfile b "$RUNNER_TEMP/fp/base/ios.json" '
                    ($b[0].sources | map({ (.filePath // .id): .hash }) | add // {}) as $bm
                    | $h[0].sources[]
                    | select($bm[(.filePath // .id)] != .hash)
                    | "  - \(.type): `\(.filePath // .id)`"'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Label
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.compare.outputs.changed }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          label="📱 Native Change"
          gh label create "$label" --color d93f0b --force \
            --description "Changes native code; it reaches people in the next store build" \
            --repo "$GITHUB_REPOSITORY"
          if [ -n "$CHANGED" ]; then
            gh pr edit "$PR" --add-label "$label" --repo "$GITHUB_REPOSITORY"
          else
            gh pr edit "$PR" --remove-label "$label" --repo "$GITHUB_REPOSITORY" || true
          fi

      - name: Check the description's Native change line
        if: ${{ steps.compare.outputs.changed != '' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          line="$(printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -iE '^\s*-\s*Native change:' | head -1 \
            | sed -E 's/<!--.*-->//g; s/^[^:]*:[[:space:]]*//')"
          if printf '%s' "$line" | grep -qiE '^no\b' || [ -z "$line" ]; then
            echo "::error::This PR changes the native fingerprint, so \"Native change:\" can't say no. Say \"yes, compatible\" if binaries without this native change still run this JavaScript, or raise RUNTIME_VERSION in apps/mobile/app.config.ts and say \"yes, new runtime\"."
            exit 1
          fi
          echo "native change: $line"
