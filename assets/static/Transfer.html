<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>n-synk</title>
        <style>
            @charset "UTF-8";

            @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');

            :root {
                --bg: #101010;
                --text: #fff;
                --main: #63a3ff;
                --disabled: #1d3c68;
                --alt-button: #fff;
                --info-text: #8d8d8d;
                --popup: #393939;
                --bad: rgb(250, 89, 89);
            }

            html {
                width: 100vw;
                height: 100vh;
                margin: 0;
                color: var(--text);
                background-color: var(--bg);
                font-family: 'Plus Jakarta Sans'
            }

            body {
                width: 100vw;
                height: 100vh;
                margin: 0;
                display: flex;
                flex-direction: column;
            }

            header {
                border-bottom: 1px solid #1e1e1e;
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                text-align: center;
                padding: 0 40px;
                color: var(--main);
                font-weight: 800;
                font-size: 20pt;
            }

            #synk-logo {
                width: 40px;
                height: auto;
            }

            #upload {
                width: 35px;
                height: auto;
                filter: invert(76%) sepia(45%) saturate(6852%) hue-rotate(194deg) brightness(105%) contrast(101%);
            }

            main {
                display: flex;
                flex: 1 0 auto;
            }

            #empty {
                display: flex;
                flex: 1 0 auto;
                justify-content: center;
                align-items: center;
                flex-direction: column;
            }

            button {
                display: inline-block;
                border-radius: 15px;
                border: none;
                font-size: 16px;
                font-weight: '400';
                width: 100px;
                height: 42px;
            }

            label {
              display: flex;
              justify-content: center;
              align-items: center;
              width: 100%;
              height: 100%;
            }

            button:hover {
                background-image: linear-gradient(rgb(0 0 0/10%) 0 0);
                cursor: pointer;
            }

            label:hover {
                cursor: pointer;
            }

            .info-text {
                font-size: 14px;
                color: var(--info-text);
                margin: 0 0 10px 0;
            }

            #overlay {
              position: absolute;
              width: 100vw;
              height: 100vh;
              background-color: rgba(0, 0, 0, .5);
              backdrop-filter: blur(5px);
              top: 0;
              z-index: 1;
              display: none;
              justify-content: center;
              align-items: center;
            }

            .popup {
              background-color: var(--popup);
              border-radius: 15px;
              padding: 10px 25px;
              user-select: none;
              text-align: center;
              justify-content: flex-start;
              align-items: center;
              flex-direction: column;
              position: relative;
            }

            #transfer-popup {
              display: none;
              height: 100px;
            }

            #error-popup {
              display: none;
              justify-content: center;
              height: 200px;
              width: 300px;
            }

            #close-error {
              position: absolute;
              top: 15px;
              right: 15px;
              width: 25px;
            }

            #close-error:hover {
              cursor: pointer;
            }

            #loading {
              width: 200px; 
              height: 80px;
              position: absolute;
              bottom: 0;
            }

            #connection-loading {
              width: 100px;
              height: 40px;
            }

            #connection-status {
              font-weight: 400;
              font-size: 14pt;
              display: flex;
              flex-direction: row;
              justify-content: center;
              align-items: center;
            }

            #server-name {
              font-weight: 800;
            }

            .connecting {
              color: white;
            }

            .connected {
              color: rgb(175, 248, 175);
            }

            .disconnected {
              color: var(--bad);
            }

        </style>
    </head>
    <body>
      <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script> 
      <script>
            document.addEventListener('DOMContentLoaded', () => {
              const overlay = document.getElementById('overlay')
              const transferPopup = document.getElementById('transfer-popup')
              const errorPopup = document.getElementById('error-popup')
              const errorClose = document.getElementById('close-error')
              const errorMessage = document.getElementById('error-message')
              const count = document.getElementById('transferCount');
              const checkEndpoint = window.location.href + 'checkConnection'
              const connectionStatus = document.getElementById('connection-status')

              const checkConnection = async () => {
                try {
                  return await fetch(checkEndpoint);
                }
                catch (error) {
                  throw error
                }
              }

              errorClose.addEventListener('click', () => {
                overlay.style.display = 'none';
                errorPopup.style.display = 'none';
              })
              
              document.getElementById('browseFiles').addEventListener('change', async (event) => {
                if (event.target.files) {
                  try {
                    const startEndpoint = window.location.href + 'startTransfer'
                    const startResponse = await fetch(startEndpoint, {
                      method: 'POST',
                      headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({
                        "size": event.target.files.length
                      })
                    })
                    
                    console.log('Server: ' + startResponse.statusText)
                    if (startResponse.status === 200) {
                      transferPopup.style.display = "none";
                      overlay.style.display = "flex";
                      transferPopup.style.display = "flex";
                      let file;
                      for (let i = 0; i < event.target.files.length; i++) {
                        count.innerText = (event.target.files.length - i);
                        file = event.target.files[i]
                        const name = file.name
                        const type = file.type
                        const blob = new Blob( [file], { type: type } )
                        const arrayBuffer = await blob.arrayBuffer()
                        const byteArray = new Uint8Array(arrayBuffer);
                        const b64 = btoa(byteArray.reduce((data, byte) => {
                          return data + String.fromCharCode(byte);
                        }, ''));
                        console.log('Sending file ' + name)
                        const transferEndpoint = window.location.href + 'fileUpload'
                        try {
                          const sendResponse = await fetch(transferEndpoint, {
                            method: 'POST',
                            headers: {
                              'Accept': 'application/json',
                              'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                              "name": name, 
                              "type": type,
                              "data": b64
                            })
                          })
                          console.log('Server: ' + sendResponse.statusText)
                        }
                        catch (error) {
                          console.log('Error: Could not send file. More info: ' + error)
                        }
                      }
                      
                      overlay.style.display = "none";
                      transferPopup.style.display = "none";
                      try {
                        const finishEndpoint = window.location.href + 'finishTransfer'
                        const finishResponse = await fetch(finishEndpoint, {
                          method: 'POST',
                          headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                          },
                          body: JSON.stringify({
                            "size": event.target.files.length
                          })
                        })
                        console.log('Server: ' + finishResponse.statusText)
                      }
                      catch (error) {
                        console.log('Server: ' + error)
                      }
                    }
                    else {
                      transferPopup.style.display = "none";
                      overlay.style.display = "flex";
                      errorPopup.style.display = "flex";
                      errorMessage.innerText = startResponse.statusText;
                    }
                  }
                  catch (error) {
                    transferPopup.style.display = "none";
                    overlay.style.display = "flex";
                    errorPopup.style.display = "flex";
                    errorMessage.innerText = "Something went wrong. Please try again."
                  }
                }
                document.getElementById('browseFiles').value = '';
              })

              const setConnected = async (response) => {
                let body = await response.text()
                let device = body ? body : 'server'
                connectionStatus.innerHTML = '<span class="connected">Connected to <span id="server-name">' + device + '</span></span>'
              }

              const setDisconnected = () => {
                connectionStatus.innerHTML = '<span class="disconnected">Failed to connect. Retrying...</span>';
              }

              const runCheck = async () => {
                await new Promise((resolve) => setTimeout(resolve, 3000));
                try {
                  let response = await checkConnection();
                  await setConnected(response);
                }
                catch (error) {
                  setDisconnected(error);
                  console.log('Failed to connect to server: ' + error)
                }
                runCheck();
              }

              runCheck();

            })
        </script>
