<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>n-synk</title>
        <script type="text/javascript" src="https://livejs.com/live.js"></script>
        <style>
            @charset "UTF-8";

            @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');

            :root {
                --bg: #101010;
                --text: #fff;
                --main: #63a3ff;
                --disabled: #1d3c68;
                --alt-button: #fff;
                --info-text: #8d8d8d;
            }

            html {
                width: 100vw;
                height: 100vh;
                margin: 0;
                color: var(--text);
                background-color: var(--bg);
                font-family: 'Plus Jakarta Sans'
            }

            body {
                width: 100vw;
                height: 100vh;
                margin: 0;
                display: flex;
                flex-direction: column;
            }

            header {
                border-bottom: 1px solid #1e1e1e;
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                text-align: center;
                padding: 0 40px;
                color: var(--main);
                font-weight: 800;
                font-size: 20pt;
            }

            #synk-logo {
                width: 50px;
                height: auto;
                filter: invert(100%) sepia(0%) saturate(0%) hue-rotate(154deg) brightness(103%) contrast(101%);
            }

            #upload {
                width: 35px;
                height: auto;
                filter: invert(76%) sepia(45%) saturate(6852%) hue-rotate(194deg) brightness(105%) contrast(101%);
            }

            main {
                display: flex;
                flex: 1 0 auto;
            }

            #empty {
                display: flex;
                flex: 1 0 auto;
                justify-content: center;
                align-items: center;
                flex-direction: column;
            }

            button {
                display: inline-block;
                width: 100px;
                height: 42px;
                border-radius: 15px;
                border: none;
                font-size: 16px;
                font-weight: '400'
            }

            button:hover {
                background-image: linear-gradient(rgb(0 0 0/10%) 0 0);
                cursor: pointer;
            }

            label:hover {
                cursor: pointer;
            }

            .info-text {
                font-size: 14px;
                color: var(--info-text);
                margin: 0 0 10px 0;
            }

        </style>
    </head>
