packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@eslint/js": ^9.38.0
  "@tanstack/react-query": ^5.101.4
  "@types/node": ^24
  "@typescript/native-preview": 7.0.0-dev.20260512.1
  babel-plugin-react-compiler: ^1.0.0
  eslint: ^9.38.0
  prettier: ^3.6.2
  tailwindcss: ^4.1.16
  typescript: ^5.9.3

catalogs:
  react19:
    "@types/react": ~19.2.0
    react: 19.2.3

linkWorkspacePackages: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild

overrides:
  # React Native pins an exact React; every package must share that copy.
  react: 19.2.3
  react-dom: 19.2.3
  lightningcss: 1.30.1

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
